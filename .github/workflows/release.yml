# Publishes a release that BRAT can install on the iPhone, tagged with the
# version in manifest.json. Run it from the Actions tab ("Run workflow").
name: Release
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          gh release create "$version" main.js manifest.json --target "$GITHUB_SHA" --title "$version" --generate-notes
